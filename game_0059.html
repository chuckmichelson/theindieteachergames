<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graph → Equation Lab</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#182638;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:25px auto;padding:0 16px 45px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:1.85rem;margin:0 0 5px}p{color:#526172;margin:4px 0 16px}button{cursor:pointer;border-radius:9px;border:0;background:#1763b6;color:white;padding:11px 15px;font-size:1rem;font-weight:650}button.secondary{background:white;color:#1763b6;border:1px solid #9cb5d0}.pill{background:#e2eefa;padding:8px 13px;border-radius:18px;font-weight:650;color:#1d4d79}.card{display:grid;grid-template-columns:minmax(230px,370px) 1fr;gap:23px;background:white;border:1px solid #dbe3ef;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 3px 10px #1826380a}.graph{width:100%;aspect-ratio:1;border:1px solid #d9e1e9;border-radius:10px;background:white}.prompt{font-size:1.1rem;font-weight:680;margin:8px 0 14px}.answerRow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.2rem}.answerRow input{width:73px;padding:10px;font-size:1.1rem;border:1px solid #a5b3c3;border-radius:8px}.answerRow input:focus{outline:2px solid #2379d6}.hint{font-size:.92rem;color:#546579;margin:12px 0}.feedback{font-weight:650;margin-top:14px;min-height:27px}.feedback.good{color:#087249}.feedback.bad{color:#b34822}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.topRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}footer{margin:28px 0 0;text-align:center}#summary{font-weight:700;margin:15px 0;color:#174a77}.example{font-size:.87rem;color:#6c7a8a}@media(max-width:650px){.card{grid-template-columns:1fr}.graph{max-width:360px;margin:auto}.card{padding:14px}h1{font-size:1.5rem}}</style></head><body><main><header><div><h1>Graph → Equation Lab</h1><p>Read each line and write its equation in <strong>y = mx + b</strong> form.</p></div><div class="topRight"><span class="pill" id="score">0 / 5 correct</span><button id="new">New set ↻</button></div></header><div id="questions"></div><footer><div id="summary"></div><button id="checkAll">Check all answers</button> <button id="another" class="secondary">Try 5 new graphs</button></footer></main>
<script>
const COUNT=5, LIMIT=6, SZ=360, PAD=28, SCALE=(SZ-2*PAD)/(LIMIT*2);
const root=document.getElementById('questions');let problems=[];
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1}
function reduced(n,d){const g=gcd(n,d);return [n/g,d/g]}
function slopeString(n,d){if(n===0)return '0';const neg=n<0?'-':'';return d===1?String(n):neg+Math.abs(n)+'/'+d}
function makeSet(){const choices=[[-3,1],[-2,1],[-1,1],[-1,2],[0,1],[1,2],[1,1],[2,1],[3,1],[2,3],[-2,3],[3,2],[-3,2]];const seen=new Set();const out=[];while(out.length<COUNT){let [n,d]=choices[rand(0,choices.length-1)],b=rand(-4,4);let key=`${n}/${d}:${b}`;if(seen.has(key))continue;seen.add(key);out.push({n,d,b,done:false,tries:0})}return out}
function pos(x,y){return [SZ/2+x*SCALE,SZ/2-y*SCALE]}
function draw(canvas,p){
  const ctx=canvas.getContext('2d'); if(!ctx)return;
  ctx.clearRect(0,0,SZ,SZ); ctx.fillStyle='#fff';ctx.fillRect(0,0,SZ,SZ);
  for(let i=-LIMIT;i<=LIMIT;i++){
    ctx.beginPath();ctx.strokeStyle=i===0?'#53687b':'#e5ebf2';ctx.lineWidth=i===0?2:1;
    let x=pos(i,0)[0],y=pos(0,i)[1];
    ctx.moveTo(x,PAD);ctx.lineTo(x,SZ-PAD);ctx.moveTo(PAD,y);ctx.lineTo(SZ-PAD,y);ctx.stroke();
    if(i!==0&&i%2===0){ctx.fillStyle='#647588';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(String(i),x,SZ/2+17);ctx.textAlign='right';ctx.fillText(String(i),SZ/2-8,y+4);}
  }
  ctx.save();ctx.beginPath();ctx.rect(PAD,PAD,SZ-2*PAD,SZ-2*PAD);ctx.clip();
  const a=pos(-LIMIT,(p.n/p.d)*(-LIMIT)+p.b),z=pos(LIMIT,(p.n/p.d)*LIMIT+p.b);
  ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...z);ctx.strokeStyle='#176ac4';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
  ctx.restore();ctx.fillStyle='#647588';ctx.font='12px system-ui';ctx.textAlign='right';ctx.fillText('0',SZ/2-7,SZ/2+15);
}
function parseNumber(s){s=s.trim().replace(/\u2212/g,'-');if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[-+]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;const v=s.split('/').map(Number);return v.length===2&&v[1]!==0?v[0]/v[1]:v.length===1?v[0]:NaN}
function verify(i){const p=problems[i],box=document.getElementById('f'+i),m=document.getElementById('m'+i),b=document.getElementById('b'+i);let mv=parseNumber(m.value),bv=parseNumber(b.value);p.tries++;const ok=Number.isFinite(mv)&&Number.isFinite(bv)&&Math.abs(mv-p.n/p.d)<1e-7&&Math.abs(bv-p.b)<1e-7;p.done=ok;box.className='feedback '+(ok?'good':'bad');box.textContent=ok?'✓ Correct! Nice work.':(!Number.isFinite(mv)||!Number.isFinite(bv)?'Enter a number or fraction for both boxes.':'Not quite. Look at where the line crosses the y-axis, then count rise over run.');document.getElementById('score').textContent=`${problems.filter(x=>x.done).length} / 5 correct`;document.getElementById('summary').textContent=problems.every(x=>x.done)?'Excellent — all five are correct! Ready for another set?':''}
function build(){problems=makeSet();root.innerHTML='';document.getElementById('score').textContent='0 / 5 correct';document.getElementById('summary').textContent='';problems.forEach((p,i)=>{p.id=i;let card=document.createElement('section');card.className='card';card.innerHTML=`<canvas class="graph" width="360" height="360" id="graph${i}" role="img" aria-label="Cartesian coordinate grid with a blue straight line"></canvas><div><div class="prompt">Question ${i+1}</div><p>What equation matches this graph?</p><div class="answerRow"><strong>y = </strong><input id="m${i}" aria-label="Slope m for question ${i+1}" placeholder="m" autocomplete="off"><strong>x + </strong><input id="b${i}" aria-label="Intercept b for question ${i+1}" placeholder="b" autocomplete="off"></div><div class="example">For negative b, type a negative number. Fractions like -1/2 are okay.</div><p class="hint">Tip: b is where the line crosses the vertical axis; m = rise ÷ run.</p><div class="buttons"><button type="button" id="check${i}">Check answer</button><button type="button" class="secondary" id="reveal${i}">Show solution</button></div><div id="f${i}" class="feedback" aria-live="polite"></div></div>`;root.appendChild(card);draw(document.getElementById('graph'+i),p);document.getElementById('check'+i).onclick=()=>verify(i);document.getElementById('reveal'+i).onclick=()=>{const sign=p.b<0?'−':'+';document.getElementById('f'+i).className='feedback';document.getElementById('f'+i).textContent=`Answer: y = ${slopeString(p.n,p.d)}x ${sign} ${Math.abs(p.b)} (slope ${slopeString(p.n,p.d)}, intercept ${p.b})`};[document.getElementById('m'+i),document.getElementById('b'+i)].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')verify(i)}))})}
document.getElementById('new').onclick=build;document.getElementById('another').onclick=build;document.getElementById('checkAll').onclick=()=>problems.forEach((p,i)=>verify(i));build();
</script></body></html>
