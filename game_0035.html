  <script>
    const canvas = document.getElementById("spellCanvas");
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    const feedback = document.getElementById("feedback");

    let assistOpacity = 0;    // 0 to 1
    let assistFullyDrawn = false;

    const worldMinX = -10, worldMaxX = 10;
    const worldMinY = -10, worldMaxY = 10;

    const choices = [-3, -2, -1, -0.5, 0.5, 1, 2, 3];
    const functionCoefficient = choices[Math.floor(Math.random() * choices.length)];
    const functionConstant = choices[Math.floor(Math.random() * choices.length)];

    let assistTimeoutId = null;
    let assistAllowed = false;

    const spellIncantations = {
      linear: "Linus Lux!",
      quadratic: "Quadraticus Arcana!",
      root: "Lumina Radicalis!",
      exponential: "Ignis Exponentia!",
      logarithmic: "Logarithmus Dimini!",
      rational: "Rationalis Supra!",
      cubic: "Cubicus Vortexi!",
      trig: "Trigonis Oscillare!",
      step: "Gradatum Terra!",
      absolute: "Absolutum Valore!"
    };
    let currentSpellName = spellIncantations.linear;
    let currentFunctionType = "linear";

    const difficultyNames = {
      "1": "Muggle",
      "3": "Apprentice",
      "5": "Adept",
      "10": "Mage",
      "infinity": "Sorcerer"
    };

    let freezeGreen = false;

    function triggerSpellPopup(spellName) {
      const popup = document.getElementById("spell-popup");
      popup.textContent = spellName;
      popup.style.display = "block";
      popup.style.animation = "none";
      void popup.offsetWidth;
      popup.style.animation = "spellPop 1.8s ease-out";
      if (popupTimerId !== null) clearTimeout(popupTimerId);
      popupTimerId = setTimeout(() => {
        popup.style.display = "none";
        popup.textContent = "";
      }, 1800);
    }

    let targetFunction = (x) => functionCoefficient * x + functionConstant;

    const aLatex = formatCoefficientLatex(functionCoefficient);
    const bRounded = Math.round(functionConstant);

    const sign = bRounded >= 0 ? '+' : '-';
    const bLatex = Math.abs(bRounded).toString();

    window.addEventListener('load', () => {
      const latexString = formatLinearEquationLatex(functionCoefficient, functionConstant);
      document.getElementById("equationLatex").innerHTML = `\\(${latexString}\\)`;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(() => {});
    });


    let selectedFunctionTypes = [];
    let assistDelay = 0;
    let currentProblemIndex = 0;
    const totalProblems = 10;
    let problemToken = 0; // Invalidates every animation belonging to the previous problem.
    let transitionTimerId = null;
    let popupTimerId = null;
    let traceActive = false;
    let solvedLocked = false;
    let missedTraces = 0;
    let assistedProblems = 0;
    let usedAssistThisProblem = false;
    let elapsedAtFinish = 0;

    function stopProblemEffects() {
      problemToken++;
      if (assistTimeoutId !== null) clearTimeout(assistTimeoutId);
      if (transitionTimerId !== null) clearTimeout(transitionTimerId);
      if (popupTimerId !== null) clearTimeout(popupTimerId);
      assistTimeoutId = transitionTimerId = popupTimerId = null;
      const popup = document.getElementById('spell-popup');
      popup.style.display = 'none';
      popup.style.animation = 'none';
    }
    let startTime = 0;
    let endTime = 0;

    function startGame() {
      // Read selected function types
      selectedFunctionTypes = [];
      document.querySelectorAll('#function-types input[type="checkbox"]:checked').forEach(cb => {
        selectedFunctionTypes.push(cb.value);
      });

      if (selectedFunctionTypes.length === 0) {
        alert("Please select at least one function type!");
        return;
      }

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      // Read selected difficulty
      const difficultyValue = document.getElementById('difficulty-select').value;
      assistDelay = difficultyValue === 'infinity' ? Infinity : parseFloat(difficultyValue) * 1000; // ms

      // Reset counters
      currentProblemIndex = 0;
      missedTraces = 0;
      assistedProblems = 0;
      freezeGreen = false;
      solvedLocked = false;

      // Start timing
      startTime = performance.now();

      // Begin first problem
      loadNextProblem();
    }


    function restartGame() {
      stopProblemEffects();
      document.getElementById('overlay').classList.add('hidden');
      const endScreen = document.getElementById('turn-in-screen');
      endScreen.classList.add('hidden');
      endScreen.style.display = 'none';
      document.querySelectorAll('.initial-box').forEach(box => {
        box.value = '';
        box.style.backgroundColor = '#fff';
      });
      document.getElementById('student-comments').value = '';
      document.getElementById('submit-status').textContent = '';
      document.getElementById('local-report-link')?.remove();
      currentProblemIndex = 0;
      missedTraces = 0;
      assistedProblems = 0;
      startTime = performance.now();
      freezeGreen = false;
      solvedLocked = false;
      traceActive = false;
      userTrace = [];
      loadNextProblem();
    }


    function revealTurnIn() {
      document.getElementById("turn-in-details").style.display = "block";
      document.getElementById("initial-0").focus();
    }


    if (assistTimeoutId !== null) {
      clearTimeout(assistTimeoutId);
      assistTimeoutId = null;
    }


    function loadNextProblem() {
      stopProblemEffects();
      traceActive = false;
      solvedLocked = false;
      freezeGreen = false;
      assistOpacity = 0;
      assistFullyDrawn = false;
      usedAssistThisProblem = false;
      assistAllowed = Number.isFinite(assistDelay);

      if (currentProblemIndex >= totalProblems) {
        endGame();
        return;
      }
      currentProblemIndex++;
      userTrace = [];
      isCorrect = false;
      isCorrectFinal = false;
      feedback.textContent = `Spell ${currentProblemIndex} of ${totalProblems}`;
      const funcType = selectedFunctionTypes[Math.floor(Math.random() * selectedFunctionTypes.length)];
      currentFunctionType = funcType;
      currentSpellName = spellIncantations[funcType];
      const {func, latex} = generateFunction(funcType);
      targetFunction = func;
      document.getElementById('equationLatex').innerHTML = `\\(${latex}\\)`;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(() => {});
      redrawTrace();

      // Capture this specific problem: no old timer may reveal a future answer.
      const token = problemToken;
      if (assistAllowed) {
        assistTimeoutId = setTimeout(() => {
          if (token === problemToken && !solvedLocked) fadeInAssist(token);
        }, assistDelay);
      }
    }

    function fadeInAssist(token) {
      if (!assistAllowed || token !== problemToken || solvedLocked) return;
      usedAssistThisProblem = true;
      let lastTime = null;
      function animate(now) {
        if (token !== problemToken || solvedLocked || !assistAllowed) return;
        if (lastTime !== null) assistOpacity = Math.min(1, assistOpacity + (now - lastTime) / 16000);
        lastTime = now;
        redrawTrace();
        if (assistOpacity < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }


    function generateFunction(type) {
      const bChoices = [-5, -3, -1, 0, 1, 3, 5];
      const shifts = [-3, -2, -1, 0, 1, 2, 3]; // gentle shifts
      const scaleChoices = [-2, -1, 1, 2];

      const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const formatShift = (h) => {
        if (h === 0) return "x";
        return `(x ${h >= 0 ? '-' : '+'} ${Math.abs(h)})`;
      };

      const formatPlusK = (k) => {
        if (k === 0) return "";
        return ` ${k > 0 ? '+ ' : '- '}${Math.abs(k)}`;
      };

      switch (type) {
        case "linear":
          const m = randomChoice(scaleChoices);
          const b = randomChoice(bChoices);
          return {
            func: (x) => m * x + b,
            latex: m === 1 ? `y = x${formatPlusK(b)}`
                 : m === -1 ? `y = -x${formatPlusK(b)}`
                 : `y = ${m}x${formatPlusK(b)}`
          };

        case "quadratic":
          const a = randomChoice(scaleChoices);
          const h = randomChoice(shifts);
          const k = randomChoice(bChoices);
          return {
            func: (x) => a * (x - h) * (x - h) + k,
            latex: a === 1
              ? `y = ${formatShift(h)}^2${formatPlusK(k)}`
              : a === -1
              ? `y = -${formatShift(h)}^2${formatPlusK(k)}`
              : `y = ${a}${formatShift(h)}^2${formatPlusK(k)}`
          };

        case "root":
          const hRoot = randomChoice(shifts.filter(x => x >= -2)); // avoid too negative
          const kRoot = randomChoice(bChoices);
          return {
            func: (x) => (x - hRoot >= 0 ? Math.sqrt(x - hRoot) + kRoot : NaN),
            latex: `y = \\sqrt{${formatShift(hRoot)}}${formatPlusK(kRoot)}`
          };

        case "exponential":
          const kExp = randomChoice(scaleChoices);
          const hExp = randomChoice(shifts);
          const vExp = randomChoice(bChoices);
          return {
            func: (x) => Math.exp(kExp * (x - hExp)) + vExp,
            latex: `y = e^{${kExp}${formatShift(hExp)}}${formatPlusK(vExp)}`
          };

        case "logarithmic":
          const hLog = randomChoice(shifts.filter(x => x >= -2));
          const kLog = randomChoice(bChoices);
          return {
            func: (x) => (x - hLog > 0 ? Math.log(x - hLog) + kLog : NaN),
            latex: `y = \\ln{${formatShift(hLog)}}${formatPlusK(kLog)}`
          };

        case "rational":
          const hRat = randomChoice(shifts.filter(x => x !== 0));
          const kRat = randomChoice(bChoices);
          return {
            func: (x) => (x - hRat !== 0 ? 1 / (x - hRat) + kRat : NaN),
            latex: `y = \\frac{1}{${formatShift(hRat)}}${formatPlusK(kRat)}`
          };

        case "cubic":
          const aCubic = randomChoice(scaleChoices);
          const hCubic = randomChoice(shifts);
          const kCubic = randomChoice(bChoices);
          return {
            func: (x) => aCubic * Math.pow(x - hCubic, 3) + kCubic,
            latex: aCubic === 1
              ? `y = ${formatShift(hCubic)}^3${formatPlusK(kCubic)}`
              : aCubic === -1
              ? `y = -${formatShift(hCubic)}^3${formatPlusK(kCubic)}`
              : `y = ${aCubic}${formatShift(hCubic)}^3${formatPlusK(kCubic)}`
          };

        case "trig":
          const shiftTrig = randomChoice(shifts);
          return {
            func: (x) => Math.sin(x - shiftTrig),
            latex: `y = \\sin${formatShift(shiftTrig)}`
          };

        case "step":
          const shiftStep = randomChoice(shifts);
          return {
            func: (x) => Math.floor(x - shiftStep),
            latex: `y = \\lfloor ${formatShift(shiftStep)} \\rfloor`
          };
        case "absolute":
          const hAbs = randomChoice(shifts);
          const kAbs = randomChoice(bChoices);
          return {
            func: (x) => Math.abs(x - hAbs) + kAbs,
            latex: `y = \\left|${formatShift(hAbs)}\\right|${formatPlusK(kAbs)}`
          };


        default:
          return generateFunction("linear");
      }
    }




    function endGame() {
      endTime = performance.now();
      elapsedAtFinish = (endTime - startTime) / 1000;
      const elapsedSeconds = ((endTime - startTime) / 1000).toFixed(2);

      document.getElementById('overlay').classList.remove('hidden');

      const turnInScreen = document.getElementById('turn-in-screen');
      turnInScreen.classList.remove('hidden');
      turnInScreen.style.display = 'block';

      // Reset initials and background color
      for (let i = 0; i < 3; i++) {
        const box = document.getElementById(`initial-${i}`);
        box.value = '';
        box.style.backgroundColor = '#fff';
      }

      // Clear comments and submit status
      document.getElementById('student-comments').value = '';
      document.getElementById('submit-status').textContent = '';
      document.getElementById('local-report-link')?.remove();

      // Focus the first initial box immediately
      document.getElementById('initial-0').focus();

      // Update summary
      document.getElementById('summary-again').textContent = `Completed ${totalProblems} spells in ${elapsedSeconds} seconds! Incorrect attempts: ${missedTraces}. Hints used: ${assistedProblems}.`;
    }



    function handleSubmission() {
      const initials = [...Array(3)].map((_, i) =>
        document.getElementById(`initial-${i}`).value.trim().toUpperCase()).join('');
      const status = document.getElementById('submit-status');
      if (!/^[A-Z]{3}$/.test(initials)) {
        status.textContent = 'Please enter three initials.';
        return;
      }
      const comments = document.getElementById('student-comments').value;
      const difficulty = difficultyNames[document.getElementById('difficulty-select').value];
      const payload = {
        game: 'game_0035',
        settings: `${selectedFunctionTypes.join(', ')}; ${difficulty}`,
        score: `${totalProblems}; ${totalProblems}`,
        elapsed: `${elapsedAtFinish.toFixed(2)} seconds`,
        initials,
        comments: `${comments}${comments ? ' | ' : ''}Incorrect attempts: ${missedTraces}; Hints used: ${assistedProblems}`
      };
      // Preserve the existing hosted game's standard submission integration.
      if (typeof window.submitResults === 'function') {
        try {
          Promise.resolve(window.submitResults(payload)).catch(err => {
            console.error('Submission failed:', err);
            status.textContent = 'Could not send. Save a local report instead.';
            offerLocalReport(payload);
          });
        } catch (err) {
          console.error('Submission failed:', err);
          status.textContent = 'Could not send. Save a local report instead.';
          offerLocalReport(payload);
        }
      } else {
        status.textContent = 'Online submission is unavailable in this copy. Save the report to share with your teacher.';
        offerLocalReport(payload);
      }
    }

    function offerLocalReport(payload) {
      const contents = Object.entries(payload).map(([key, value]) => `${key}: ${value}`).join('\n');
      const blob = new Blob([contents], {type: 'text/plain'});
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = `function-spells-${payload.initials.toLowerCase()}-report.txt`;
      link.textContent = 'Download turn-in report';
      const status = document.getElementById('submit-status');
      const old = document.getElementById('local-report-link');
      if (old) old.remove();
      link.id = 'local-report-link';
      link.style.cssText = 'display:block;color:#ffe066;margin:12px';
      status.after(link);
    }

    function toCanvasX(x) {
      return ((x - worldMinX) / (worldMaxX - worldMinX)) * width;
    }

    function toCanvasY(y) {
      return height - ((y - worldMinY) / (worldMaxY - worldMinY)) * height;
    }

    function plotFunctionPath(fromX = worldMinX, toX = worldMaxX) {
      ctx.beginPath();
      let previousY = NaN;
      let connected = false;
      const step = (worldMaxX - worldMinX) / 400;
      for (let i = 0; i <= 400; i++) {
        const x = fromX + i * step;
        if (x > toX + 1e-8) break;
        const y = targetFunction(x);
        if (!Number.isFinite(y) || y < worldMinY - 1 || y > worldMaxY + 1) {
          connected = false;
          previousY = NaN;
          continue;
        }
        const cx = toCanvasX(x), cy = toCanvasY(y);
        // Do not bridge asymptotes or sharp discontinuities.
        if (!connected || !Number.isFinite(previousY) || Math.abs(y - previousY) > 3) {
          ctx.moveTo(cx, cy);
        } else {
          ctx.lineTo(cx, cy);
        }
        connected = true;
        previousY = y;
      }
    }

    function drawAssistGraph() {
      ctx.save();
      ctx.globalAlpha = assistOpacity;
      plotFunctionPath();
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.stroke();
      ctx.restore();
    }

    function drawGridAndAxes() {
      ctx.save();
      ctx.strokeStyle = '#3d4350';
      ctx.lineWidth = 1;
      for (let x = Math.ceil(worldMinX); x <= worldMaxX; x++) {
        const cx = toCanvasX(x);
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke();
      }
      for (let y = Math.ceil(worldMinY); y <= worldMaxY; y++) {
        const cy = toCanvasY(y);
        ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(width, cy); ctx.stroke();
      }
      const originX = toCanvasX(0), originY = toCanvasY(0);
      ctx.strokeStyle = '#b7c1d0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY);
      ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke();
      // Every grid square has its own labeled 1-unit tick.
      ctx.font = '11px Arial, sans-serif';
      ctx.fillStyle = '#e0e6ef';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'center';
      for (let x = worldMinX + 1; x < worldMaxX; x++) {
        if (x === 0) continue;
        const cx = toCanvasX(x);
        ctx.beginPath(); ctx.moveTo(cx, originY - 4); ctx.lineTo(cx, originY + 4); ctx.stroke();
        ctx.fillText(String(x), cx, originY + 6);
      }
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (let y = worldMinY + 1; y < worldMaxY; y++) {
        if (y === 0) continue;
        const cy = toCanvasY(y);
        ctx.beginPath(); ctx.moveTo(originX - 4, cy); ctx.lineTo(originX + 4, cy); ctx.stroke();
        ctx.fillText(String(y), originX - 7, cy);
      }
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillText('0', originX - 6, originY + 6);
      ctx.restore();
    }

    let userTrace = [];
    let isCorrect = false;
    let isCorrectFinal = false;
    const threshold = 2;

    function redrawTrace() {
      ctx.clearRect(0, 0, width, height);
      drawGridAndAxes();

      // Always draw assist if any opacity
      if (assistOpacity > 0) {
        drawAssistGraph();
      }

      // Then draw user trace
      if (userTrace.length === 0) return;
      
      const color = (freezeGreen || isCorrect) ? "#00ff88" : "#ffaa33";
      ctx.beginPath();
      userTrace.forEach((pt, i) => {
        const cx = toCanvasX(pt.x);
        const cy = toCanvasY(pt.y);
        if (i === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.shadowColor = color;
      ctx.shadowBlur = 30;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }



    function calculateLSE() {
      if (userTrace.length < 10) return Infinity;
      let error = 0;
      for (const pt of userTrace) {
        const expectedY = targetFunction(pt.x);
        error += (expectedY - pt.y) ** 2;
      }
      return error / userTrace.length;
    }

    function evaluateTrace() {
      const lse = calculateLSE();
      isCorrect = lse < threshold;
      feedback.textContent = isCorrect ? "" : "";
      redrawTrace();
    }

    function startTrace(e) {
      if (solvedLocked || currentProblemIndex > totalProblems) return;
      e.preventDefault();
      traceActive = true;
      userTrace = [];
      isCorrect = false;
      addPoint(e);
    }

    function addPoint(e) {
      if (!traceActive || solvedLocked) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = (clientX - rect.left) / rect.width * (worldMaxX - worldMinX) + worldMinX;
      const y = worldMaxY - (clientY - rect.top) / rect.height * (worldMaxY - worldMinY);
      if (!Number.isFinite(x) || !Number.isFinite(y)) return;
      userTrace.push({x, y});
      evaluateTrace();
    }

    canvas.addEventListener('pointerdown', e => {
      if (solvedLocked) return;
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      startTrace(e);
    });
    canvas.addEventListener('pointermove', e => { if (traceActive) addPoint(e); });
    canvas.addEventListener('pointerup', handleRelease);
    canvas.addEventListener('pointercancel', () => { traceActive = false; });
    redrawTrace();

    function handleRelease(e) {
      if (!traceActive || solvedLocked) return;
      e.preventDefault();
      traceActive = false;
      const traceLength = calculateTraceLength();
      const minimumLength = 4;
      if (isCorrect && traceLength > minimumLength) {
        solvedLocked = true; // Only one success and one transition per problem.
        freezeGreen = true;
        isCorrectFinal = true;
        if (usedAssistThisProblem) assistedProblems++;
        // Disable hint animation even if it was already fading in.
        assistAllowed = false;
        if (assistTimeoutId !== null) clearTimeout(assistTimeoutId);
        triggerSpellPopup(currentSpellName);
        assistOpacity = 0; // Do not reveal the solution on later Sorcerer questions.
        startGreenTraceAnimation(problemToken);
        const token = problemToken;
        transitionTimerId = setTimeout(() => {
          if (token !== problemToken) return;
          loadNextProblem();
        }, 2500);
      } else {
        missedTraces++;
        vanishSpell(problemToken, userTrace.slice());
      }
    }


    function calculateTraceLength() {
      let total = 0;
      for (let i = 1; i < userTrace.length; i++) {
        const dx = userTrace[i].x - userTrace[i-1].x;
        const dy = userTrace[i].y - userTrace[i-1].y;
        total += Math.sqrt(dx*dx + dy*dy);
      }
      return total;
    }


    function vanishSpell(token, trace) {
      const start = performance.now();
      function animate(now) {
        if (token !== problemToken || traceActive || solvedLocked) return;
        const fade = Math.max(0, 1 - (now - start) / 320);
        redrawTrace();
        if (fade > 0) {
          ctx.save(); ctx.globalAlpha = fade;
          ctx.beginPath();
          trace.forEach((pt, i) => i ? ctx.lineTo(toCanvasX(pt.x), toCanvasY(pt.y)) : ctx.moveTo(toCanvasX(pt.x), toCanvasY(pt.y)));
          ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
          requestAnimationFrame(animate);
        } else {
          userTrace = [];
          isCorrect = false;
          redrawTrace();
        }
      }
      userTrace = [];
      requestAnimationFrame(animate);
    }

    function startGreenTraceAnimation(token) {
      const start = performance.now();
      const successfulTrace = userTrace.slice();
      function animate(now) {
        if (token !== problemToken || !solvedLocked) return;
        const t = Math.min((now - start) / 2000, 1);
        ctx.clearRect(0, 0, width, height);
        drawGridAndAxes();
        ctx.save();
        ctx.globalAlpha = 1 - t;
        ctx.beginPath();
        successfulTrace.forEach((pt, i) => i ? ctx.lineTo(toCanvasX(pt.x), toCanvasY(pt.y)) : ctx.moveTo(toCanvasX(pt.x), toCanvasY(pt.y)));
        ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 22; ctx.stroke();
        ctx.restore();
        ctx.save();
        plotFunctionPath(worldMinX, worldMinX + (worldMaxX - worldMinX) * t);
        ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15;
        ctx.stroke(); ctx.restore();
        if (t < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }


    function formatCoefficientLatex(coef) {
      const isInteger = Math.abs(coef - Math.round(coef)) < 1e-6;
      if (isInteger) {
        if (coef === 1) return '';
        if (coef === -1) return '-';
        return coef.toString();
      }

      const frac = simplifyFraction(coef);
      return `\\frac{${frac.numerator}}{${frac.denominator}}`;
    }

    function simplifyFraction(decimal) {
      const precision = 1000;
      let numerator = Math.round(decimal * precision);
      let denominator = precision;

      const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
      const divisor = gcd(Math.abs(numerator), denominator);

      return {
        numerator: numerator / divisor,
        denominator: denominator / divisor
      };
    }


    function formatLinearEquationLatex(a, b) {
      let aStr = '';
      if (Math.abs(a - Math.round(a)) < 1e-6) {
        // Integer coefficient
        if (a === 1) aStr = 'x';
        else if (a === -1) aStr = '-x';
        else aStr = `${a}x`;
      } else {
        // Fractional coefficient
        const numerator = Math.round(a * 10);
        const denominator = 10;
        aStr = `\\frac{${numerator}}{${denominator}}x`;
      }

      const bRounded = Math.round(b);
      const bStr = bRounded > 0 ? `+ ${bRounded}` : bRounded < 0 ? `- ${Math.abs(bRounded)}` : '';

      return `y = ${aStr} ${bStr}`;
    }

    window.addEventListener('load', () => {
      for (let i = 0; i < 3; i++) {
        const box = document.getElementById(`initial-${i}`);
        box.addEventListener('input', () => {
          if (box.value.trim() !== "") {
            box.style.backgroundColor = "#00ff88"; // light green
          } else {
            box.style.backgroundColor = "#fff"; // back to white if emptied
          }
        });
      }
    });


  </script>
